[project]
name = "usd-scene-audit"
version = "1.0.0"
description = "Command-line OpenUSD scene audit tools for geometry, naming, hierarchy, materials, and authored asset references."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "usd-core>=25.5",
]

[project.scripts]
usd-geometry-audit = "usd_scene_audit.geometry:main"
usd-names-hierarchy-audit = "usd_scene_audit.names_hierarchy:main"
usd-scene-audit = "usd_scene_audit.scene:main"

[project.optional-dependencies]
numba = [
    "numba>=0.65.1",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py310"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]


[tool.pytest.ini_options]
# The suite itself must use the keyword API; tests of the deprecated positional
# form assert the warning with pytest.warns, which overrides this filter.
filterwarnings = [
    "error:passing .* is deprecated:DeprecationWarning",
]
markers = [
    "expects_check_errors: the test deliberately makes a check fail and record to CheckErrorLog",
]
